<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f1" />
    <title>Gather | Chat</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Gather home">
          <span class="brand-mark" aria-hidden="true">g</span>
          <span>gather<span class="brand-period">.</span></span>
        </a>
        <div class="topbar-note">A little room to talk</div>
        <div id="identity" class="identity-field" hidden>
          <span id="identity-dot" class="identity-dot" aria-hidden="true"></span>
          <span id="identity-name" class="identity-name"></span>
          <button id="logout-button" class="logout-button" type="button">Log out</button>
        </div>
      </header>

      <main id="auth-view" class="auth-shell" hidden>
        <form id="auth-form" class="auth-card">
          <div id="auth-eyebrow" class="eyebrow">WELCOME BACK</div>
          <h1 id="auth-title">Log in to gather</h1>
          <label class="auth-field">
            <span>Username</span>
            <input id="auth-username" autocomplete="username" maxlength="24" required />
          </label>
          <label class="auth-field">
            <span>Password</span>
            <input id="auth-password" type="password" autocomplete="current-password" maxlength="128" required />
          </label>
          <button id="auth-submit" class="auth-submit" type="submit">Log in</button>
          <p class="auth-switch">
            <span id="auth-switch-text">New here?</span>
            <button id="auth-switch" type="button">Create an account</button>
          </p>
          <div id="auth-notice" class="notice" role="alert"></div>
        </form>
      </main>

      <main id="chat-view" class="chat-shell" hidden>
        <aside class="room-rail" aria-label="Chat room">
          <div class="rail-heading">YOUR SPACE</div>
          <div class="room-current">
            <span class="room-hash">#</span>
            <input id="room-input" aria-label="Room name" maxlength="32" value="general" />
            <button id="join-button" class="join-button" type="button" title="Join room" aria-label="Join room">↵</button>
          </div>
          <p class="room-hint">Choose a room and say hello.</p>
          <div class="rail-bottom">
            <span class="online-dot" aria-hidden="true"></span>
            <span id="connection-label">Connecting</span>
          </div>
        </aside>

        <section class="conversation" aria-label="Conversation">
          <div class="conversation-header">
            <div>
              <div class="eyebrow">ROOM</div>
              <h1><span class="heading-hash">#</span><span id="room-title">general</span></h1>
            </div>
            <div class="people-count"><span class="people-icon" aria-hidden="true">••</span> Live chat <span id="role-label" class="role-label"></span></div>
          </div>

          <details id="reports-panel" class="reports-panel" hidden>
            <summary>Reported messages (<span id="reports-count">0</span>)</summary>
            <ul id="reports-list" class="reports-list"></ul>
          </details>

          <div class="load-older-wrap">
            <button id="load-older" class="load-older-btn" type="button" hidden>Load older messages</button>
          </div>

          <div id="message-list" class="message-list" role="log" aria-live="polite" aria-relevant="additions text">
            <div class="welcome-note is-loading" data-placeholder="true">
              <span class="welcome-spark" aria-hidden="true">✳</span>
              <div class="welcome-title">Loading messages</div>
              <p>Fetching the conversation.</p>
            </div>
          </div>

          <form id="message-form" class="composer">
            <label class="sr-only" for="message-input">Write a message</label>
            <input id="message-input" type="text" maxlength="1000" placeholder="Write a message..." autocomplete="off" />
            <button class="send-button" type="submit" aria-label="Send message" title="Send message">
              <span aria-hidden="true">↑</span>
            </button>
          </form>
          <div id="notice" class="notice" role="status"></div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
